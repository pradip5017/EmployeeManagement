spring.application.name=EmployeeManagement

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/employeeManagementZest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
jwt.secret=MySecretKeyForEmployeeManagementApplication123456
jwt.expiration=86400000